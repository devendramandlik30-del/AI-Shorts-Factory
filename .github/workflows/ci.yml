name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:   # allows manual trigger from GitHub UI

jobs:
  test:
    name: Syntax check + unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check all Python files
        run: |
          python -m py_compile main.py
          python -m py_compile run_all.py
          python -m py_compile daily_run.py
          python -m py_compile ai/generate_voice.py
          python -m py_compile ai/fetch_visuals.py
          python -m py_compile ai/make_video.py
          python -m py_compile ai/add_captions.py
          python -m py_compile ai/upload_youtube.py

      - name: Run unit tests
        run: |
          python -m pytest tests/ -v